{% extends 'base.html' %}

{% block title %}Create bank account | Nexora ERP{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Cash management</p>
        <h1>Create bank account</h1>
    </div>
</section>

<div class="login-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary" type="submit">Save account</button>
    </form>
</div>
{% endblock %}
